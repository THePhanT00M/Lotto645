<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>이메일 인증</title>
</head>
<body style="margin:0; padding:0; background-color:#f2f4f6;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f2f4f6; padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px; background-color:#ffffff; border-radius:12px; overflow:hidden; font-family:-apple-system,BlinkMacSystemFont,'Malgun Gothic','맑은 고딕',sans-serif;">

          <tr>
            <td align="center" style="background-color:#f2f4f6; padding:28px 24px;">
              <span style="font-size:22px; font-weight:700; color:#0f0f0f; letter-spacing:-0.3px;">Lotto645</span>
            </td>
          </tr>

          <tr>
            <td style="padding:36px 32px 8px 32px;">
              <h1 style="margin:0 0 12px 0; font-size:20px; font-weight:700; color:#0f0f0f; letter-spacing:-0.3px;">가입을 환영합니다! 👋</h1>
              <p style="margin:0; font-size:15px; line-height:1.7; color:#4b5563;">서비스를 시작하려면 이메일 주소 확인이 필요합니다. 아래 버튼을 눌러 인증을 완료해 주세요.</p>
            </td>
          </tr>

          <tr>
            <td align="center" style="padding:28px 32px;">
              <a href="{{ .ConfirmationURL }}" style="display:inline-block; background-color:#22c55e; color:#ffffff; font-size:15px; font-weight:600; text-decoration:none; padding:14px 32px; border-radius:8px;">이메일 확인하기</a>
            </td>
          </tr>

          <tr>
            <td style="padding:0 32px 8px 32px;">
              <p style="margin:0 0 8px 0; font-size:13px; line-height:1.6; color:#6b7280;">버튼이 작동하지 않으면 아래 주소를 복사해 브라우저에 붙여넣어 주세요.</p>
              <p style="margin:0; font-size:12px; line-height:1.6; word-break:break-all;">
                <a href="{{ .ConfirmationURL }}" style="color:#2563eb; text-decoration:underline;">{{ .ConfirmationURL }}</a>
              </p>
            </td>
          </tr>

          <tr>
            <td style="padding:20px 32px 32px 32px;">
              <p style="margin:0; font-size:13px; line-height:1.7; color:#92400e; background-color:#fffbeb; border:1px solid #fde68a; border-radius:8px; padding:12px 14px;">본인이 가입한 것이 아니라면 이 메일을 무시해 주세요. 아무 일도 일어나지 않습니다.</p>
            </td>
          </tr>

          <tr>
            <td align="center" style="background-color:#f9fafb; padding:20px 24px; border-top:1px solid #eef0f3;">
              <p style="margin:0; font-size:12px; color:#9ca3af;">© 2026 Lotto645. All rights reserved.</p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
